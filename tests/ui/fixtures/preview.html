<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sage preview fixture</title>
    <style>
      :root {
        color: #e8edf7;
        background: #0d111b;
        font-family: Inter, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 32px;
      }
      main {
        max-width: 620px;
        margin: 0 auto;
      }
      .eyebrow {
        color: #9aa9c2;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 12px 0;
        font-size: 34px;
        line-height: 1.08;
      }
      p {
        color: #b8c2d6;
        line-height: 1.6;
      }
      .card {
        margin-top: 28px;
        padding: 20px;
        border: 1px solid #2a3650;
        border-radius: 14px;
        background: #151c2a;
      }
      .status {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        color: #9ce3bd;
        font-size: 13px;
      }
      .status::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4ecb83;
        content: "";
      }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">Agent preview</span>
      <h1>Product coherence review</h1>
      <p>
        A deterministic loopback page verifies Preview framing, address chrome,
        and right-pane ownership without relying on an external service.
      </p>
      <section class="card">
        <span class="status">Preview ready</span>
        <p>The Agent resource pane remains useful while work continues.</p>
      </section>
    </main>
  </body>
</html>
