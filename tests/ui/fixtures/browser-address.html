<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser address visual fixture</title>
  </head>
  <body>
    <div
      class="browser-surface"
      style="position: relative; width: 560px; height: 400px"
    >
      <div id="toolbar" class="browser-surface__toolbar"></div>
      <div id="error" class="browser-surface__error" role="alert" hidden></div>
    </div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { BrowserNavigationControls } from "/src/features/browser/BrowserNavigationControls.tsx";
      import { BrowserAttachmentControls } from "/src/features/browser/BrowserAttachmentControls.tsx";
      import { BrowserDownloadsControl } from "/src/features/browser/BrowserDownloadsControl.tsx";
      import { BrowserAgentPresence } from "/src/features/browser/BrowserAgentPresence.tsx";
      import { useAgentArtifactPaneFocus } from "/src/workbench/useAgentArtifactPaneFocus.ts";
      import { BrowserClearData } from "/src/features/browser/BrowserClearData.tsx";
      import "/src/styles/global.css";
      import "/src/styles/shared-dialogs.css";
      import "/src/features/browser/browser.css";

      const url = "https://en.wikipedia.org/wiki/Web_browser";
      const params = new URLSearchParams(location.search);
      const newTab = params.has("new-tab");
      const chatTitle = params.get("chat");
      const width = params.get("width");
      if (width)
        document.querySelector(".browser-surface").style.width = `${width}px`;
      const artifactFocus = params.has("artifact-focus");
      function Fixture() {
        const [address, setAddress] = React.useState(newTab ? "" : url);
        const addressField = React.useRef(null);
        const [downloadsOpen, setDownloadsOpen] = React.useState(false);
        const [expanded, setExpanded] = React.useState(true);
        const paneRef = React.useRef(null);
        const triggerRef = React.useRef(null);
        const onKeyDown = useAgentArtifactPaneFocus({
          expanded: artifactFocus && expanded,
          overlay: false,
          paneRef,
          triggerRef,
          onExpandedChange: setExpanded,
        });
        const controls = React.createElement(BrowserNavigationControls, {
          navigation: {
            tabId: "browser-visual",
            url: newTab ? "" : url,
            revision: "1",
            loading: false,
            canGoBack: !newTab,
            canGoForward: false,
            zoomPercent: 100,
          },
          page: newTab
            ? null
            : {
                origin: "https://en.wikipedia.org",
                transport: "secure",
                url,
              },
          address,
          addressField,
          onAddressChange: setAddress,
          onNavigate: () => {},
          onControl: () => {},
          onError: () => {},
          onFind: () => {},
          onZoom: () => {},
          onZoomReset: () => {},
          onDownloads: () => setDownloadsOpen(true),
          onHistory: () => {},
          onSettings: () => {},
          onCopy: () => {},
          onExternal: () => {},
          clearDataControl: React.createElement(BrowserClearData, {
            menuItem: true,
          }),
          pageControls: (visible) =>
            chatTitle
              ? React.createElement(
                  "div",
                  { className: "browser-surface__page-actions" },
                  React.createElement(BrowserAttachmentControls, {
                    visible,
                    projectId: "project-visual",
                    tabId: "browser-visual",
                    ready: true,
                    onError: (message) => {
                      const row = document.getElementById("error");
                      row.textContent = message ?? "";
                      row.hidden = !message;
                    },
                    chats: [
                      { id: "chat-visual", title: chatTitle },
                      ...params.getAll("also").map((title, index) => ({
                        id: `chat-also-${index}`,
                        title,
                      })),
                    ],
                  }),
                  visible && params.has("agent")
                    ? React.createElement(BrowserAgentPresence, {
                        pending: false,
                        userControl: false,
                        chatTitle,
                        onStop: () => {},
                        onTakeOver: () => {},
                        onHandBack: () => {},
                      })
                    : null,
                )
              : visible
                ? React.createElement(
                    "button",
                    { "aria-label": "Attach page" },
                    "▣",
                  )
                : null,
          downloadsControl: chatTitle
            ? React.createElement(BrowserDownloadsControl, {
                tabId: "browser-visual",
                open: downloadsOpen,
                onOpenChange: setDownloadsOpen,
              })
            : undefined,
        });
        return artifactFocus
          ? React.createElement(
              React.Fragment,
              null,
              React.createElement(
                "button",
                { ref: triggerRef, onClick: () => setExpanded(true) },
                "Show files and preview",
              ),
              expanded
                ? React.createElement(
                    "aside",
                    {
                      ref: paneRef,
                      tabIndex: -1,
                      onKeyDown,
                      "aria-label": "Agent artifacts",
                    },
                    controls,
                  )
                : null,
            )
          : controls;
      }
      createRoot(document.getElementById("toolbar")).render(
        React.createElement(Fixture),
      );
    </script>
  </body>
</html>
