<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser address visual fixture</title>
  </head>
  <body>
    <div
      class="browser-surface"
      style="position: relative; width: 560px; height: 400px"
    >
      <div id="toolbar" class="browser-surface__toolbar"></div>
    </div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { BrowserNavigationControls } from "/src/features/browser/BrowserNavigationControls.tsx";
      import { useAgentArtifactPaneFocus } from "/src/workbench/useAgentArtifactPaneFocus.ts";
      import { BrowserClearData } from "/src/features/browser/BrowserClearData.tsx";
      import "/src/styles/global.css";
      import "/src/styles/shared-dialogs.css";
      import "/src/features/browser/browser.css";

      const url = "https://en.wikipedia.org/wiki/Web_browser";
      const newTab = new URLSearchParams(location.search).has("new-tab");
      const artifactFocus = new URLSearchParams(location.search).has(
        "artifact-focus",
      );
      function Fixture() {
        const [address, setAddress] = React.useState(newTab ? "" : url);
        const addressField = React.useRef(null);
        const [expanded, setExpanded] = React.useState(true);
        const paneRef = React.useRef(null);
        const triggerRef = React.useRef(null);
        const onKeyDown = useAgentArtifactPaneFocus({
          expanded: artifactFocus && expanded,
          overlay: false,
          paneRef,
          triggerRef,
          onExpandedChange: setExpanded,
        });
        const controls = React.createElement(BrowserNavigationControls, {
          navigation: {
            tabId: "browser-visual",
            url: newTab ? "" : url,
            revision: "1",
            loading: false,
            canGoBack: !newTab,
            canGoForward: false,
            zoomPercent: 100,
          },
          page: newTab
            ? null
            : {
                origin: "https://en.wikipedia.org",
                transport: "secure",
                url,
              },
          address,
          addressField,
          onAddressChange: setAddress,
          onNavigate: () => {},
          onControl: () => {},
          onError: () => {},
          onFind: () => {},
          onZoom: () => {},
          onZoomReset: () => {},
          onDownloads: () => {},
          onHistory: () => {},
          onSettings: () => {},
          onCopy: () => {},
          onExternal: () => {},
          clearDataControl: React.createElement(BrowserClearData, {
            menuItem: true,
          }),
          pageControls: React.createElement(
            "button",
            { "aria-label": "Attach page" },
            "▣",
          ),
        });
        return artifactFocus
          ? React.createElement(
              React.Fragment,
              null,
              React.createElement(
                "button",
                { ref: triggerRef, onClick: () => setExpanded(true) },
                "Show files and preview",
              ),
              expanded
                ? React.createElement(
                    "aside",
                    {
                      ref: paneRef,
                      tabIndex: -1,
                      onKeyDown,
                      "aria-label": "Agent artifacts",
                    },
                    controls,
                  )
                : null,
            )
          : controls;
      }
      createRoot(document.getElementById("toolbar")).render(
        React.createElement(Fixture),
      );
    </script>
  </body>
</html>
