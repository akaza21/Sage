<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser downloads visual fixture</title>
  </head>
  <body>
    <div
      class="browser-surface"
      style="position: relative; width: 960px; height: 480px"
    >
      <div id="toolbar" class="browser-surface__toolbar"></div>
      <div class="browser-surface__frame"></div>
    </div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { BrowserNavigationControls } from "/src/features/browser/BrowserNavigationControls.tsx";
      import { BrowserDownloadsControl } from "/src/features/browser/BrowserDownloadsControl.tsx";
      import "/src/styles/global.css";
      import "/src/features/browser/browser.css";

      const url = "https://example.com/";
      function Fixture() {
        const [open, setOpen] = React.useState(true);
        const addressField = React.useRef(null);
        return React.createElement(BrowserNavigationControls, {
          navigation: {
            tabId: "browser-visual",
            url,
            revision: "1",
            loading: false,
            canGoBack: true,
            canGoForward: false,
            zoomPercent: 100,
          },
          page: { origin: "https://example.com", transport: "secure", url },
          address: url,
          addressField,
          onAddressChange: () => {},
          onNavigate: () => {},
          onControl: () => {},
          onError: () => {},
          onFind: () => {},
          onZoom: () => {},
          onZoomReset: () => {},
          onDownloads: () => setOpen(true),
          onHistory: () => {},
          onSettings: () => {},
          onCopy: () => {},
          onExternal: () => {},
          clearDataControl: null,
          downloadsControl: React.createElement(BrowserDownloadsControl, {
            tabId: "browser-visual",
            open,
            onOpenChange: setOpen,
          }),
        });
      }
      createRoot(document.getElementById("toolbar")).render(
        React.createElement(Fixture),
      );
    </script>
  </body>
</html>
