<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat performance fixture</title>
    <script>
      // Count component renders per commit the way React DevTools does: a
      // component rendered when it mounted or performed work, and a subtree
      // whose child list is unchanged bailed out. Unlike wall-clock time,
      // this work count does not depend on the machine's speed or load.
      window.chatPerfRenders = 0;
      const PERFORMED_WORK = 1;
      const COMPONENT_TAGS = new Set([0, 1, 11, 14, 15]);
      const countRendered = (next, prev) => {
        let count =
          COMPONENT_TAGS.has(next.tag) &&
          (prev === null || (next.flags & PERFORMED_WORK) !== 0)
            ? 1
            : 0;
        if (prev !== null && next.child === prev.child) return count;
        for (let child = next.child; child; child = child.sibling)
          count += countRendered(child, prev === null ? null : child.alternate);
        return count;
      };
      const renderers = new Map();
      window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = {
        supportsFiber: true,
        renderers,
        inject(renderer) {
          const id = renderers.size + 1;
          renderers.set(id, renderer);
          return id;
        },
        checkDCE() {},
        onScheduleFiberRoot() {},
        onCommitFiberRoot(_id, root) {
          window.chatPerfRenders += countRendered(
            root.current,
            root.current.alternate,
          );
        },
        onCommitFiberUnmount() {},
        onPostCommitFiberRoot() {},
      };
    </script>
  </head>
  <body>
    <div class="message-list" style="width: 760px; height: 700px">
      <div class="message-list__content" id="chat-performance"></div>
    </div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { flushSync } from "react-dom";
      import { AcpChatPresentation } from "/src/features/chat/acp/AcpChatPresentation.tsx";
      import { useFollowEnd } from "/src/features/chat/useFollowEnd.ts";
      import { useSubagentPaneStore } from "/src/app/subagentPaneStore.ts";
      import "/src/styles/global.css";
      import "/src/styles/chat-surface.css";
      import "/src/features/chat/chat-transcript-polish.css";
      import "/src/features/chat/acp/acp-chat.css";
      import "/src/features/chat/acp/acp-chat-activities.css";

      const root = createRoot(document.getElementById("chat-performance"));
      const scroll = document.querySelector(".message-list");
      const follow = new URLSearchParams(location.search).has("follow");
      const transcriptRef = { current: scroll };
      const contentRef = {
        current: document.getElementById("chat-performance"),
      };
      let current;
      let commits = [];
      const item = (turn, ordinal, kind, payload) => ({
        id: `item-${turn}-${ordinal}`,
        projectId: "project-1",
        chatId: "chat-1",
        sessionId: "session-1",
        turnId: `turn-${turn}`,
        runtimeEpoch: "1",
        ordinal,
        origin: "primary",
        activityId: null,
        lifecycle: "completed",
        revision: "1",
        createdAt: 1000 + turn,
        updatedAt: 1000 + turn,
        terminalAt: 1000 + turn,
        kind,
        toolState: kind === "toolCall" ? "completed" : null,
        payload,
      });
      const text = (turn, ordinal, role, value) =>
        item(turn, ordinal, "text", { role, text: value });
      const tool = (turn, ordinal) =>
        item(turn, ordinal, "toolCall", {
          presentation: {
            kind: "execute",
            label: "Ran command",
            summary: "npm test",
            cwd: null,
            exitCode: 0,
            outputTail: "passed",
            outputTruncated: false,
            resources: [],
            activity: "ordinary",
          },
          inputSummary: null,
        });
      const subagent = (turn, ordinal) =>
        item(turn, ordinal, "collaboration", {
          activityId: null,
          label: `Worker ${turn}-${ordinal}`,
          summary: "",
          receiverLabels: [`Worker ${turn}-${ordinal}`],
          operation: "started",
          agentKey: `worker-${turn}-${ordinal}`,
          agentKeys: [`worker-${turn}-${ordinal}`],
          agentStates: [[`worker-${turn}-${ordinal}`, "running"]],
        });
      const makeTurn = (index, mode) => {
        const number = index + 1;
        const markdown =
          number % 25 === 0
            ? "Summary\n\n```mermaid\ngraph LR\nA-->B\n```"
            : number % 7 === 0
              ? "**Result** with `inline code` and a [link](https://example.com)."
              : `Completed Turn ${number}.`;
        const items = [
          text(number, 1, "user", `Request ${number}`),
          text(number, 2, "assistant", markdown),
        ];
        if (mode === "cap") {
          items.push(
            tool(number, 3),
            tool(number, 4),
            item(number, 5, "plan", {
              entries: [{ label: "Check", state: "completed" }],
            }),
            item(number, 6, "fileChangeDiff", {
              changes: [],
              truncated: false,
            }),
            item(number, 7, "thoughtSummary", { summary: "Reasoned briefly" }),
            subagent(number, 8),
            subagent(number, 9),
            subagent(number, 10),
          );
        } else if (number > 1700) items.push(subagent(number, 3));
        return {
          id: `turn-${number}`,
          sessionId: "session-1",
          runtimeEpoch: "1",
          ordinal: number,
          state: "completed",
          revision: "1",
          createdAt: 1000 + number,
          updatedAt: 1000 + number,
          terminalAt: 1000 + number,
          items,
          activities: [],
          browserOperations: [],
          browserOperationsCollapsed: 0,
        };
      };
      const makePage = (mode) => ({
        projectId: "project-1",
        chatId: "chat-1",
        title: "Performance fixture",
        projectionRevision: "1",
        currentSessionId: "session-1",
        sessions: [{ id: "session-1" }],
        nextCursor: null,
        turns: Array.from({ length: mode === "cap" ? 100 : 2000 }, (_, index) =>
          makeTurn(index, mode),
        ),
      });
      const props = (page) => ({
        page,
        hasEarlier: false,
        loadingEarlier: false,
        historyError: null,
        projectRoots: [],
        retentionIncomplete: false,
      });
      const recordCommit = (_id, phase, duration) =>
        commits.push({ phase, duration });
      function FollowHarness({ page }) {
        const endRef = React.useRef(null);
        const { showJumpToLatest, updateFollowEnd, jumpToLatest } =
          useFollowEnd({
            ownerKey: "fixture",
            revision: page.projectionRevision,
            transcriptRef,
            contentRef,
            endRef,
          });
        React.useEffect(() => {
          scroll.addEventListener("scroll", updateFollowEnd);
          return () => scroll.removeEventListener("scroll", updateFollowEnd);
        }, [updateFollowEnd]);
        return React.createElement(
          React.Fragment,
          null,
          React.createElement(AcpChatPresentation, props(page)),
          React.createElement("div", { ref: endRef }),
          showJumpToLatest
            ? React.createElement(
                "button",
                {
                  id: "chat-performance-jump",
                  type: "button",
                  onClick: jumpToLatest,
                  style: { position: "fixed", top: 0 },
                },
                "Jump to latest",
              )
            : null,
        );
      }
      const render = () =>
        root.render(
          React.createElement(
            React.Profiler,
            { id: "chat", onRender: recordCommit },
            follow
              ? React.createElement(FollowHarness, { page: current })
              : React.createElement(AcpChatPresentation, props(current)),
          ),
        );
      window.chatPerf = {
        openedSubagent: () => useSubagentPaneStore.getState().open,
        mount(mode) {
          current = makePage(mode);
          commits = [];
          window.chatPerfRenders = 0;
          const start = performance.now();
          flushSync(render);
          const mountMs = performance.now() - start;
          const componentRenders = window.chatPerfRenders;
          scroll.scrollTop = scroll.scrollHeight;
          return {
            mountMs,
            componentRenders,
            commitCount: commits.length,
            commitDurationMs: commits.reduce(
              (sum, commit) => sum + commit.duration,
              0,
            ),
            domNodes: document.querySelectorAll("*").length,
            renderedTurns: document.querySelectorAll(".acp-turn").length,
            heapBytes: performance.memory?.usedJSHeapSize ?? null,
          };
        },
        stream(count) {
          const durations = [];
          let commitCount = 0;
          window.chatPerfRenders = 0;
          for (let index = 0; index < count; index += 1) {
            const last = current.turns.at(-1);
            const revised = {
              ...last,
              revision: String(index + 2),
              items: last.items.map((entry, position) =>
                position === 1
                  ? {
                      ...entry,
                      revision: String(index + 2),
                      payload: {
                        ...entry.payload,
                        text: `Streaming delta ${index}`,
                      },
                    }
                  : entry,
              ),
            };
            current = {
              ...current,
              projectionRevision: String(index + 2),
              turns: [...current.turns.slice(0, -1), revised],
            };
            commits = [];
            const start = performance.now();
            flushSync(render);
            durations.push(performance.now() - start);
            commitCount += commits.length;
          }
          return {
            durations,
            componentRenders: window.chatPerfRenders,
            commitCount,
            domNodes: document.querySelectorAll("*").length,
            heapBytes: performance.memory?.usedJSHeapSize ?? null,
          };
        },
        scrollToTop() {
          scroll.scrollTop = 0;
          scroll.dispatchEvent(new Event("scroll"));
          return document.querySelectorAll(".acp-turn").length;
        },
        scrollToMiddle() {
          scroll.scrollTop = scroll.scrollHeight / 2;
          scroll.dispatchEvent(new Event("scroll"));
        },
        visibleAnchor() {
          const top = scroll.getBoundingClientRect().top;
          const turn = [...document.querySelectorAll(".acp-turn")].find(
            (element) => element.getBoundingClientRect().bottom > top + 16,
          );
          return turn
            ? {
                id: turn.dataset.turnId,
                top: turn.getBoundingClientRect().top - top,
              }
            : null;
        },
        prepend(count) {
          const older = Array.from({ length: count }, (_, index) =>
            makeTurn(index - count, "cap"),
          );
          current = {
            ...current,
            turns: [...older, ...current.turns],
          };
          flushSync(render);
        },
        distanceFromEnd() {
          return scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight;
        },
      };
    </script>
  </body>
</html>
