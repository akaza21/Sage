[package]
name = "sage-workspace"
description = "Sage's project files: roots, reads and writes, ignore rules, Quick Open's path index and Search."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
ignore.workspace = true
memchr.workspace = true
regex.workspace = true
sage-core.workspace = true
sage-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
sage-test-support.workspace = true
uuid.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true

[target.'cfg(windows)'.dependencies]
# Names the temporary file of an atomic write.
uuid.workspace = true
# The Recycle Bin's progress sink is a COM object (`#[implement]`).
windows.workspace = true
windows-core.workspace = true
windows-sys.workspace = true

[features]
default = []
# Test-only helpers the app's tests use. Enabled only from
# `[dev-dependencies]`, never from `[dependencies]`.
test-support = []
