[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]
default-members = ["src-tauri"]
# The footprint control is a standalone Tauri app with its own lockfile and
# release profile; it is built on its own and never linked into Sage.
exclude = ["tools/footprint-control"]

[workspace.package]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
# Internal crates, by path, so members write `sage-core.workspace = true`.
sage-acp-protocol = { path = "crates/sage-acp-protocol" }
sage-core = { path = "crates/sage-core" }
sage-db = { path = "crates/sage-db" }
sage-domain = { path = "crates/sage-domain" }
sage-process = { path = "crates/sage-process" }
sage-test-support = { path = "crates/sage-test-support" }

base64 = "=0.22.1"
# Gitignore rules for workspace walks (EDIT-0005 AD-3); only its matcher is used.
ignore = "=0.4.34"
png = "=0.17.16"
jpeg-decoder = { version = "=0.3.2", default-features = false }
# Re-encodes downscaled prompt images that PNG cannot fit (photos, gradients).
# Pure Rust with no dependencies (about 190 KiB of source); it runs only when
# an attached image is normalised, on the upload's blocking thread.
jpeg-encoder = { version = "=0.7.1", default-features = false, features = ["std"] }
# Quick Open's byte prefilter (EDIT-0005 EP-07). Already in the lock through
# regex, ignore and serde_json, so it adds no new code to the build.
memchr = "=2.8.3"
agent-client-protocol-schema = { version = "=1.4.0", default-features = false }
rusqlite = { version = "=0.41.0", features = ["backup", "bundled", "hooks", "modern_sqlite"] }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
# `preserve_order` keeps object keys in the order a harness sent them, which
# Sage shows (an MCP form's questions, for one). The all-features test build
# already turned it on through `acp-schema`, so declaring it here makes the
# shipped build match the tested one. indexmap is already in the build.
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["unstable"] }
tauri-build = { version = "=2.6.3", features = [] }
tauri-plugin-dialog = "=2.7.2"
thiserror = "=2.0.19"
# Reads the RFC 3339 reset times in Claude Code's usage report. Already in
# the lock through Tauri's cookie support; `parsing` adds only its parser.
time = { version = "=0.3.54", default-features = false, features = ["parsing"] }
toml = "=0.8.2"
tokio = { version = "=1.53.3", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt"] }
url = "=2.5.8"
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
# Saved browser passwords (BF-7b): AES-256-GCM sealing, zeroized plaintext
# buffers, and a no-alloc CSV state machine that bounds every import record.
# Pure Rust with no build scripts or C (aes-gcm adds aead, aes, cipher, ctr,
# ghash, polyval, universal-hash, inout and opaque-debug; it reuses the lock's
# crypto-common, generic-array and subtle). Nothing runs until the vault opens
# on first use, so startup is unchanged. getrandom is already in the build
# through Tauri.
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
# `aes-gcm/zeroize` wipes only the GHASH state; the AES key schedule needs
# its own feature.
aes = { version = "=0.8.4", default-features = false, features = ["zeroize"] }
csv-core = "=0.1.13"
getrandom = "=0.3.4"
zeroize = "=1.9.1"

# Linux and macOS only.
libc = "=0.2.189"

# Linux only: XDG turn notices over the session bus, and raising the window
# with a click's activation token. All three are already in the lock through
# tao; no new crate or system library.
dbus = "=0.9.12"
gdkwayland-sys = "=0.18.2"
gtk = "=0.18.2"

# macOS only: the system Trash (NSFileManager) and turn notices
# (UNUserNotificationCenter). All four crates are already in the lock, through
# Tauri and wry (objc2-user-notifications through objc2-ui-kit), so no new
# crate is fetched; this adds binding features only.
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSError", "NSFileManager", "NSString", "NSURL"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter"] }

# Windows only.
webview2-com = "=0.38.2"
webview2-com-sys = "=0.38.2"
windows = { version = "=0.61.3", default-features = false, features = [
  "std",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_WinRT",
  "Foundation",
  "Media_SpeechRecognition",
  # Native turn toasts reuse this dependency, including Action Center clicks.
  "UI_Notifications",
  "Data_Xml_Dom",
  "Security_Credentials_UI",
] }
windows-core = { version = "=0.61.2", default-features = false, features = ["std"] }
# Awaits the Windows Hello prompt's IAsyncOperation; already in the build
# through `windows`.
windows-future = { version = "=0.2.1", default-features = false }
# Native lane only (`native-lane`): the loopback HTTPS fixture's self-signed
# certificate and TLS server. Never in default or release builds.
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Native lane only: prints the webview creation errors Tauri and wry only log.
log = { version = "=0.4.33", default-features = false, features = ["std"] }
windows-sys = { version = "=0.61.2", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Performance",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
incremental = true
# Line tables keep panic locations and backtraces readable. Full debug info
# (variables and types) is what makes debug builds slow to compile and link
# and large on disk; set CARGO_PROFILE_DEV_DEBUG=true for a debugger session.
debug = "line-tables-only"

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.libsqlite3-sys]
opt-level = 3

# Image normalisation decodes and re-encodes full-size screenshots and photos;
# unoptimised codecs make each such test take tens of seconds.
[profile.dev.package.png]
opt-level = 3

[profile.dev.package.jpeg-decoder]
opt-level = 3

[profile.dev.package.jpeg-encoder]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
