[package]
name = "sage"
version = "0.1.0"
description = "A small, persistent, ACP-native agent development environment."
authors = ["Sage contributors"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "sage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
agent-client-protocol = { version = "=1.3.0", optional = true }
rusqlite = { version = "=0.40.1", features = ["bundled", "modern_sqlite"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["io-util", "process", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "=1.24.0", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[features]
default = []
acp-runtime = ["dep:agent-client-protocol"]
custom-protocol = ["tauri/custom-protocol"]
diagnostics = []

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
