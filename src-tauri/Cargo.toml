[package]
name = "sage"
version = "0.1.0"
description = "A small, persistent, ACP-native agent development environment."
authors = ["Sage contributors"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "sage"

[lib]
name = "sage_lib"
crate-type = ["rlib"]
doctest = false

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
aes.workspace = true
aes-gcm.workspace = true
base64.workspace = true
csv-core.workspace = true
getrandom.workspace = true
futures-util = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
jpeg-decoder.workspace = true
png.workspace = true
regex.workspace = true
rusqlite.workspace = true
sage-acp-protocol.workspace = true
sage-core.workspace = true
sage-db.workspace = true
sage-domain.workspace = true
sage-git.workspace = true
sage-images.workspace = true
sage-process.workspace = true
sage-workspace.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
sage-acp-protocol = { workspace = true, features = ["test-support"] }
sage-db = { workspace = true, features = ["test-support"] }
sage-git = { workspace = true, features = ["test-support"] }
sage-images = { workspace = true, features = ["test-support"] }
sage-test-support.workspace = true
sage-workspace = { workspace = true, features = ["test-support"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
dbus.workspace = true
gdkwayland-sys.workspace = true
gtk.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-avf-audio.workspace = true
objc2-speech.workspace = true
objc2-user-notifications.workspace = true

[target.'cfg(windows)'.dependencies]
log = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webview2-com.workspace = true
webview2-com-sys.workspace = true
windows.workspace = true
windows-core.workspace = true
windows-future.workspace = true
windows-sys.workspace = true

[[bin]]
name = "acp-adversarial-fixture"
path = "src/bin/acp_adversarial_fixture.rs"
required-features = ["acp-fixture"]

[[bin]]
name = "sage-codex-elevated-helper"
path = "src/bin/codex_provisioning_helper.rs"
required-features = ["codex-provisioning-helper"]

[[test]]
name = "acp_adversarial_fixture"
path = "tests/acp_adversarial_fixture.rs"
required-features = ["acp-fixture"]

# Boots the real Sage browser on WebView2 (Windows debug builds only); see
# docs/work-items/BROWSER-FIRST-CLASS/native-lane.md.
[[test]]
name = "native_lane"
path = "tests/native_lane/main.rs"
harness = false
required-features = ["native-lane"]

[features]
default = []
browser-bridge = ["dep:futures-util", "dep:subtle", "dep:tokio-tungstenite", "tokio/net", "serde_json/raw_value"]
acp-fixture = ["sage-acp-protocol/fixture", "sage-db/fixture"]
# Runs browser::devtools tests against a real headless Chromium (unix only).
cdp-lane = []
codex-provisioning-helper = []
custom-protocol = ["tauri/custom-protocol"]
diagnostics = []
# The WebView2 native test lane: a test-only seam plus its TLS fixture deps.
native-lane = ["dep:log", "dep:rcgen", "dep:rustls"]
