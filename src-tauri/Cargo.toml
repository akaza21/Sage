[package]
name = "sage"
version = "0.1.0"
description = "A small, persistent, ACP-native agent development environment."
authors = ["Sage contributors"]
edition = "2024"
rust-version = "1.88"
default-run = "sage"

[lib]
name = "sage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
# Gitignore rules for workspace walks (EDIT-0005 AD-3); only its matcher is used.
ignore = "=0.4.34"
png = "=0.17.16"
jpeg-decoder = { version = "=0.3.2", default-features = false }
# Quick Open's byte prefilter (EDIT-0005 EP-07). Already in the lock through
# regex, ignore and serde_json, so it adds no new code to the build.
memchr = "=2.8.3"
agent-client-protocol-schema = { version = "=1.4.0", optional = true, default-features = false }
rusqlite = { version = "=0.40.1", features = ["backup", "bundled", "hooks", "modern_sqlite"] }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["unstable"] }
tauri-plugin-dialog = "=2.7.2"
thiserror = "=2.0.19"
toml = "=0.8.2"
tokio = { version = "=1.53.3", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt"] }
url = "=2.5.8"
uuid = { version = "=1.24.0", features = ["serde", "v4"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "=0.2.189"

# macOS only: the system Trash (NSFileManager). Both crates are already in the
# lock through Tauri and wry; this adds two Foundation binding features.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
webview2-com-sys = "=0.38.2"
windows = { version = "=0.61.3", default-features = false, features = [
  "std",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Media_SpeechRecognition",
] }
windows-core = { version = "=0.61.2", default-features = false, features = ["std"] }
# Native lane only (`native-lane`): the loopback HTTPS fixture's self-signed
# certificate and TLS server. Never in default or release builds.
rcgen = { version = "=0.14.10", optional = true, default-features = false, features = ["crypto", "ring"] }
rustls = { version = "=0.23.46", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
# Native lane only: prints the webview creation errors Tauri and wry only log.
log = { version = "=0.4.33", optional = true, default-features = false, features = ["std"] }
windows-sys = { version = "=0.61.2", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Performance",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[[bin]]
name = "acp-adversarial-fixture"
path = "src/bin/acp_adversarial_fixture.rs"
required-features = ["acp-fixture"]

[[bin]]
name = "sage-codex-0146-elevated-helper"
path = "src/bin/codex_provisioning_helper.rs"
required-features = ["codex-provisioning-helper"]

[[test]]
name = "acp_adversarial_fixture"
path = "tests/acp_adversarial_fixture.rs"
required-features = ["acp-fixture"]

# Boots the real Sage browser on WebView2 (Windows debug builds only); see
# docs/work-items/BROWSER-FIRST-CLASS/native-lane.md.
[[test]]
name = "native_lane"
path = "tests/native_lane/main.rs"
harness = false
required-features = ["native-lane"]

[features]
default = []
acp-fixture = []
acp-schema = ["dep:agent-client-protocol-schema"]
# Runs browser::devtools tests against a real headless Chromium (unix only).
cdp-lane = []
codex-provisioning-helper = []
custom-protocol = ["tauri/custom-protocol"]
diagnostics = []
# The WebView2 native test lane: a test-only seam plus its TLS fixture deps.
native-lane = ["dep:log", "dep:rcgen", "dep:rustls"]

[profile.dev]
incremental = true

[profile.dev.package.sha2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
