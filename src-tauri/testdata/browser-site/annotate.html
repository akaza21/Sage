<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Annotate canaries</title>
  </head>
  <body>
    <div
      id="block"
      style="
        width: 120px;
        height: 80px;
        margin: 24px 0 0 40px;
        background: #f00;
      "
    ></div>
    <label id="wrapped-input">Ship to <input id="ship" type="text" /></label>
    <div id="wrapped-select" role="button" tabindex="0">
      Deliver
      <select id="speed">
        <option>Standard</option>
        <option>CANARY-SELECT-4e8a13</option>
      </select>
    </div>
    <div id="hidden-text">
      Visible words
      <span style="opacity: 0">CANARY-OPACITY-71c2d0</span>
      <span style="color: transparent">CANARY-CLEAR-0b5e94</span>
      <span style="font-size: 1px">CANARY-TINY-c39f27</span>
      <span style="position: absolute; left: -9999px">CANARY-AWAY-8d14b6</span>
    </div>
    <button id="press" type="button">Press me</button>
    <div style="height: 3000px"></div>
  </body>
</html>
