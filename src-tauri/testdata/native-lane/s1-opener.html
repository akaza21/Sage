<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>S1 opener</title>
  </head>
  <body>
    <h1>S1 opener</h1>
    <script>
      const report = (name, data) =>
        fetch(`/report/${name}`, {
          method: "POST",
          body: JSON.stringify(data),
        });
      window.addEventListener("message", (event) =>
        report("s1-message", { data: event.data, origin: event.origin }),
      );
      // The lane calls these with a user gesture, as a click would.
      window.__open = (url) => window.open(url) !== null;
      window.__openBlank = (url) => {
        const popup = window.open("");
        if (popup === null) return "null";
        try {
          popup.location = url;
          return "assigned";
        } catch (error) {
          return `threw ${error}`;
        }
      };
      // A blank popup whose first real navigation is a blob: document that
      // would report `marker` (absolute: blob URLs resolve nothing relative).
      window.__openBlob = (marker) => {
        const popup = window.open("");
        if (popup === null) return "null";
        const page = `<script>fetch(${JSON.stringify(location.origin + marker)}, {method: "POST"})<\/script>`;
        popup.location = URL.createObjectURL(
          new Blob([page], { type: "text/html" }),
        );
        return "assigned";
      };
    </script>
  </body>
</html>
