approval_policy = "never"
sandbox_mode = "read-only"
model_provider = "openai"
cli_auth_credentials_store = "file"
check_for_update_on_startup = false

[analytics]
enabled = false

[otel]
exporter = "none"
trace_exporter = "none"
metrics_exporter = "none"
log_user_prompt = false

[features]
apps = false
plugins = false
network_proxy = false
respect_system_proxy = false
