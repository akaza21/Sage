[package]
name = "sage-footprint-control"
version = "0.1.0"
description = "Disposable matched Tauri/WebView2 control for Sage measurements."
edition = "2024"
rust-version = "1.88"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
