name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The source-functional attestation test resolves the candidate commit
          # named by the committed attestation manifest; that commit is an
          # ancestor of HEAD and is absent from a depth-1 checkout.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml --release --lib

  macos-shared-contracts:
    name: macOS shared contracts
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Compile shared contracts
        run: cargo check --manifest-path src-tauri/Cargo.toml --release --lib
      - name: Test workspace-notify shared contract
        run: cargo test --manifest-path src-tauri/Cargo.toml workspace::notify
      - name: Test editor-watch shared contract
        run: cargo test --manifest-path src-tauri/Cargo.toml editor_watch

  merge-gate:
    name: Merge gate
    if: always()
    needs:
      - frontend
      - rust
      - macos-shared-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          FRONTEND: ${{ needs.frontend.result }}
          RUST: ${{ needs.rust.result }}
          MACOS_SHARED_CONTRACTS: ${{ needs.macos-shared-contracts.result }}
        run: |
          test "$FRONTEND" = "success"
          test "$RUST" = "success"
          test "$MACOS_SHARED_CONTRACTS" = "success"
