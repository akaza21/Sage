name: CI

# The Linux lanes every pull request and every push to main runs, all of
# them every time: Vitest and Rust tests read files across the language
# boundary, so no path rule can safely skip a lane. Windows, macOS, the native
# budget lane and the desktop packages run after merge (main.yml); a failure
# there opens an issue.

on:
  schedule:
    - cron: "23 6 * * *"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

# One run per source branch: a new push to a pull request supersedes the run
# already in flight for the same head. Each push to main gets a group of its
# own run, so no later push (even of the same commit) cancels or replaces it:
# every main run finishes and saves the Rust caches that pull requests
# restore. The key names the repository the branch lives in, so a fork's
# branch never shares a group with a branch of the same name here.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled' || github.event_name == 'push' && format('push-{0}', github.run_id) || 'branch' }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2
        with:
          tool: cargo-deny@0.20.2
      - name: Audit Rust dependencies
        run: cargo deny check advisories bans sources
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=critical
      # Schedules and draft PRs run only this job, so it checks source
      # policy on those triggers.
      - name: Check source policy and regression tests
        run: node --test scripts/check-policy.node-test.mjs && node scripts/check-policy.mjs

  frontend:
    name: Frontend and policy
    # Only the security job runs on schedules and draft pull requests.
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    # Vitest runs in its own sharded job below; this job runs the rest of
    # `npm run check` in the same order.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The policy check reads the workspace through `cargo metadata`.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:budgets
      - run: npm run build
      - run: npm run test:web-bundle
      - run: npm run check:policy

  vitest:
    name: Vitest (${{ matrix.shard }}/3)
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    # One unsharded run takes about 5.5 minutes on ubuntu-latest; Vitest
    # splits the files across the three shards, so every file still runs.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test -- --shard=${{ matrix.shard }}/3

  # Lint, tests, and the browser-bridge and release builds, as three jobs.
  # After merge calls the same workflow for Windows and macOS.
  rust:
    name: Rust
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    uses: ./.github/workflows/rust.yml
    with:
      runners: '["ubuntu-latest"]'

  merge-gate:
    name: Merge gate
    if: >-
      always() && github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs:
      - security
      - frontend
      - vitest
      - rust
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lane
        env:
          SECURITY: ${{ needs.security.result }}
          FRONTEND: ${{ needs.frontend.result }}
          VITEST: ${{ needs.vitest.result }}
          RUST: ${{ needs.rust.result }}
        run: |
          set -euo pipefail
          require() {
            test "$2" = "success" || { echo "::error::$1: $2"; exit 1; }
          }
          require "Security" "$SECURITY"
          require "Frontend and policy" "$FRONTEND"
          require "Vitest" "$VITEST"
          require "Rust" "$RUST"
          {
            echo "### Verified in this run"
            echo "- Security: $SECURITY"
            echo "- Frontend and policy: $FRONTEND"
            echo "- Vitest: $VITEST"
            echo "- Rust on Linux (lint, tests, bridge and release): $RUST"
            echo "- Windows, macOS, the Windows budget lane and the packages run after merge (main.yml)."
          } >> "$GITHUB_STEP_SUMMARY"
