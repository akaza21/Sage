name: CI

# Pull requests and pushes to main require Windows Playwright alongside the
# Linux lanes. Draft pull requests run Security and Windows Playwright; the
# remaining lanes start when the pull request is ready for review.
# Windows budgets and Windows/macOS Rust remain opt-in on a branch:
#
#   gh workflow run ci.yml --ref <branch> -f platforms=windows|macos|all
#
# Requested checks land on the branch's head commit, next to its PR checks.

on:
  schedule:
    - cron: "23 6 * * *"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platforms:
        description: Platform lanes to run in addition to Linux
        type: choice
        default: all
        options:
          - linux
          - windows
          - macos
          - all

permissions:
  contents: read

# One run per source branch: a new push, or a requested platform run,
# supersedes the run already in flight for the same head. The key names the
# repository the branch lives in, so a fork's branch never shares a group with
# a branch of the same name here.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled' || 'branch' }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2
        with:
          tool: cargo-deny@0.20.2
      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo deny check advisories bans sources
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=critical
      - name: Check source policy and regression tests
        run: node --test scripts/check-policy.node-test.mjs && node scripts/check-policy.mjs

  plan:
    name: Plan lanes
    # Schedules run Security only; every PR must plan Windows Playwright.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.plan.outputs.frontend }}
      rust: ${{ steps.plan.outputs.rust }}
      rust-os: ${{ steps.plan.outputs.rust-os }}
      rust-matrix: ${{ steps.plan.outputs.rust-matrix }}
      windows: ${{ steps.plan.outputs.windows }}
      playwright: ${{ steps.plan.outputs.playwright }}
    steps:
      - uses: actions/checkout@v4
      - name: Choose the lanes this change needs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
          AFTER: ${{ github.sha }}
          PLATFORMS: ${{ inputs.platforms }}
          REPOSITORY: ${{ github.repository }}
          # Paths the Rust crate compiles in or reads in its tests.
          RUST_PATHS: ^(src-tauri/|testdata/|tests/fixtures/|docs/work-items/|scripts/ade|scripts/cargo-features\.mjs$|src/features/chat/acp/|rust-toolchain\.toml$|\.github/workflows/)
        run: |
          set -euo pipefail
          frontend=true
          rust=true
          # Both sides of a rename count, so moving a file out of a Rust path
          # still runs Rust.
          names='.filename, (.previous_filename // empty)'
          case "$EVENT" in
            pull_request)
              # The files API lists at most 3000 files.
              gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" \
                --jq ".[] | $names" > changed-files
              limit=3000
              ;;
            push)
              # A new branch or a force push has no reliable base to compare.
              if [ -n "${BEFORE//0/}" ] && [ "$FORCED" != "true" ]; then
                # The compare API lists at most 300 files.
                gh api "repos/$REPOSITORY/compare/$BEFORE...$AFTER" \
                  --jq ".files[] | $names" > changed-files
                limit=300
              fi
              ;;
          esac
          # Past the API's file limit the list is incomplete, so Rust runs.
          if [ -f changed-files ] && [ "$(wc -l < changed-files)" -lt "$limit" ] \
            && ! grep -Eq "$RUST_PATHS" changed-files; then
            rust=false
          fi
          if [ "$DRAFT" = "true" ]; then
            frontend=false
            rust=false
          fi

          windows=false
          macos=false
          case "${PLATFORMS:-linux}" in
            windows) windows=true ;;
            macos) macos=true ;;
            all) windows=true; macos=true ;;
          esac

          playwright=$windows
          case "$EVENT" in
            pull_request|push) playwright=true ;;
          esac

          rust_os='["ubuntu-latest"'
          if [ "$windows" = "true" ]; then rust_os+=',"windows-latest"'; fi
          if [ "$macos" = "true" ]; then rust_os+=',"macos-latest"'; fi
          rust_os+=']'

          {
            echo "frontend=$frontend"
            echo "rust=$rust"
            echo "rust-os=$rust_os"
            echo "rust-matrix=$(node --input-type=module -e '
              import { runnerFeatures } from "./scripts/cargo-features.mjs";
              console.log(JSON.stringify(JSON.parse(process.argv[1]).map(runnerFeatures)));
            ' "$rust_os")"
            echo "windows=$windows"
            echo "playwright=$playwright"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Lanes"
            echo "- Frontend and policy: $frontend"
            echo "- Rust: $rust on $rust_os"
            echo "- Windows budget lane: $windows"
            echo "- Windows Playwright: $playwright"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend and policy
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # Measured on ubuntu-latest: Vitest alone takes about 12 minutes (425
    # files), before the budget lanes, build and policy checks.
    timeout-minutes: 30
    env:
      SAGE_UI_PORT: "15471"
    steps:
      - uses: actions/checkout@v4
        with:
          # The source-functional attestation test resolves the candidate commit
          # named by the committed attestation manifest; that commit is an
          # ancestor of HEAD and is absent from a depth-1 checkout.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Provision Chromium for portable browser checks
        run: npx playwright install --with-deps chromium
      # Keep this allowlist baseline-free; screenshot comparisons run on Windows.
      - name: Run portable browser checks
        run: >-
          npm run test:ui --
          tests/ui/browser-confirm.visual.ts
          tests/ui/browser-annotate-keyboard.visual.ts
          tests/ui/browser-site-permissions.visual.ts
          --workers=2 --retries=0 --trace=retain-on-failure
      - name: Upload portable Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-linux-failure
          path: |
            playwright-report/
            output/playwright/
          retention-days: 3
          if-no-files-found: ignore

  playwright:
    name: Windows Playwright
    needs: plan
    if: needs.plan.outputs.playwright == 'true'
    runs-on: windows-latest
    # Leave room for Chromium provisioning and the full two-worker suite.
    timeout-minutes: 45
    env:
      # Playwright forwards this fixed port to Vite with --strictPort and refuses
      # server reuse. Each hosted job has its own runner, including the budget lane.
      SAGE_UI_PORT: "15471"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Provision Chromium for the win32 baselines
        run: npx playwright install chromium
      - name: Run the full Playwright suite
        run: |
          # Sample the runner's socket table and nonpaged pool beside the suite,
          # so a connection failure such as ERR_NO_BUFFER_SPACE names its cause.
          New-Item -ItemType Directory -Force output | Out-Null
          $samples = Join-Path $PWD output/tcp-samples.log
          netsh int ipv4 show dynamicport tcp | Out-File -Append $samples
          netsh int ipv4 show excludedportrange protocol=tcp | Out-File -Append $samples
          $sampler = Start-Job -ArgumentList $samples, $env:SAGE_UI_PORT -ScriptBlock {
            param($samples, $port)
            while ($true) {
              $all = Get-NetTCPConnection -ErrorAction SilentlyContinue
              $states = ($all | Group-Object State | ForEach-Object { "$($_.Name)=$($_.Count)" }) -join ' '
              $toUi = ($all | Where-Object RemotePort -eq $port).Count
              $pool = (Get-Counter '\Memory\Pool Nonpaged Bytes' -ErrorAction SilentlyContinue).CounterSamples.CookedValue
              "$(Get-Date -Format o) $states toUi=$toUi nonpaged=$pool" | Out-File -Append $samples
              Start-Sleep -Seconds 10
            }
          }
          npm run test:ui -- --workers=2 --retries=0 --trace=retain-on-failure
          $code = $LASTEXITCODE
          Stop-Job $sampler
          exit $code
      - name: Upload Windows socket samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-windows-tcp
          path: output/tcp-samples.log
          retention-days: 3
          if-no-files-found: ignore
      - name: Upload Windows Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-windows-failure
          path: |
            playwright-report/
            output/playwright/
          retention-days: 3
          if-no-files-found: ignore

  smoke-cli:
    name: Windows budget lane (browser)
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Provision the bundled Chromium the smoke CLI drives
        run: npx playwright install chromium
      # The Windows Cargo Job tests give each cargo command 10 s. The image
      # keeps rustup on C:, which Defender saturates for about 30 s when it
      # loads new security intelligence partway through the job; a rustup
      # proxy that pages in from C: then can stall past that deadline. Install
      # rustup into the runner temp directory, which shares the workspace's
      # disk (D: on hosted images), so rustup, its proxies and the toolchain
      # are not read from C:.
      - name: Install rustup on the runner's local disk
        run: |
          $cargoHome = Join-Path $env:RUNNER_TEMP "cargo"
          $rustupHome = Join-Path $env:RUNNER_TEMP "rustup"
          $installer = Join-Path $env:RUNNER_TEMP "rustup-init.exe"
          Copy-Item (Get-Command rustup -CommandType Application | Select-Object -First 1).Source $installer
          $env:CARGO_HOME = $cargoHome
          $env:RUSTUP_HOME = $rustupHome
          & $installer -y --no-modify-path --default-toolchain none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item $installer
          "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$rustupHome" >> $env:GITHUB_ENV
          Join-Path $cargoHome "bin" >> $env:GITHUB_PATH
      # Install the rust-toolchain.toml toolchain first so no command waits on
      # a download.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Run the Windows budget lane
        # Hosted TEMP can use an 8.3 short spelling, which
        # the native-IDE journey scripts refuse as non-canonical.
        # Point temp files at the runner's long-path temp directory instead.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: npm run test:budgets:windows

  rust:
    name: Rust (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    # A cold-cache run builds and runs the parallel test phase in about 20
    # minutes on ubuntu-latest, before Clippy, the serial phases and the
    # release check.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.rust-matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Branches restore main's cache instead of each writing their own,
          # which would evict it under the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Create Tauri frontend placeholder
        run: >-
          node -e "require('node:fs').mkdirSync('dist', { recursive: true })"
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features "${{ matrix.lint-features }}" -- -D warnings
      # The parallel phase includes the shared-contract suites
      # (workspace::notify, editor_watch) on every platform it runs on.
      - name: Test Rust parallel phase
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --features "${{ matrix.test-features }}" -- --skip repository_mutation_commands::tests:: --skip app_preview'
      - name: Test repository mutation commands serially
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --features "${{ matrix.test-features }}" repository_mutation_commands::tests:: -- --test-threads=1'
      - name: Test app preview serially
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --features "${{ matrix.test-features }}" app_preview -- --test-threads=1'
      - run: cargo check --manifest-path src-tauri/Cargo.toml --release --lib

  merge-gate:
    name: Merge gate
    if: always() && github.event_name != 'schedule'
    needs:
      - security
      - plan
      - frontend
      - smoke-cli
      - playwright
      - rust
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every planned lane
        env:
          SECURITY: ${{ needs.security.result }}
          PLAN: ${{ needs.plan.result }}
          FRONTEND: ${{ needs.frontend.result }}
          FRONTEND_PLANNED: ${{ needs.plan.outputs.frontend }}
          SMOKE_CLI: ${{ needs.smoke-cli.result }}
          SMOKE_CLI_PLANNED: ${{ needs.plan.outputs.windows }}
          PLAYWRIGHT: ${{ needs.playwright.result }}
          PLAYWRIGHT_PLANNED: ${{ needs.plan.outputs.playwright }}
          RUST: ${{ needs.rust.result }}
          RUST_PLANNED: ${{ needs.plan.outputs.rust }}
          RUST_OS: ${{ needs.plan.outputs.rust-os }}
        run: |
          set -euo pipefail
          # A planned lane must succeed; a lane the plan left out must not have run.
          require() {
            local lane="$1" planned="$2" result="$3"
            if [ "$planned" = "true" ]; then
              test "$result" = "success" || { echo "::error::$lane: $result"; exit 1; }
            else
              test "$result" = "skipped" || { echo "::error::$lane ran unplanned: $result"; exit 1; }
            fi
          }
          require "Security" "true" "$SECURITY"
          test "$PLAN" = "success"
          require "Frontend and policy" "$FRONTEND_PLANNED" "$FRONTEND"
          require "Windows budget lane" "$SMOKE_CLI_PLANNED" "$SMOKE_CLI"
          require "Windows Playwright" "$PLAYWRIGHT_PLANNED" "$PLAYWRIGHT"
          require "Rust" "$RUST_PLANNED" "$RUST"
          {
            echo "### Verified in this run"
            echo "- Security: $SECURITY"
            echo "- Frontend and policy: $FRONTEND"
            echo "- Rust on $RUST_OS: $RUST"
            echo "- Windows budget lane: $SMOKE_CLI"
            echo "- Windows Playwright: $PLAYWRIGHT"
            for platform in windows macos; do
              case "$RUST_OS" in
                *"$platform-latest"*) ;;
                *) echo "- Not run on $platform: request it with workflow_dispatch or record a local run." ;;
              esac
            done
          } >> "$GITHUB_STEP_SUMMARY"
