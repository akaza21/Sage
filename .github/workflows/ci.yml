name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The source-functional attestation test resolves the candidate commit
          # named by the committed attestation manifest; that commit is an
          # ancestor of HEAD and is absent from a depth-1 checkout.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  smoke-cli:
    name: Windows budget lane (browser)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Provision the bundled Chromium the smoke CLI drives
        run: npx playwright install chromium
      # The Windows Cargo Job tests give each cargo command 10 s; install the
      # rust-toolchain.toml toolchain first so no command waits on a download.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Run the Windows budget lane
        # The runner's TEMP is the 8.3 short path C:\Users\RUNNER~1\..., which
        # the native-IDE journey scripts refuse as non-canonical.
        # Point temp files at the runner's long-path temp directory instead.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: npm run test:budgets:windows

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # --all-features cannot build anywhere: cdp-lane is unix-only and
        # native-lane is Windows-only. Clippy lints every feature that builds
        # on the runner; the test phases leave out the two device lanes, which
        # have their own runners. scripts/cargo-features.mjs derives both
        # lists from Cargo.toml, and ci-rust-phase.node-test.mjs pins them.
        include:
          - os: windows-latest
            lint-features: acp-fixture,acp-schema,codex-provisioning-helper,custom-protocol,diagnostics,native-lane
            test-features: acp-fixture,acp-schema,codex-provisioning-helper,custom-protocol,diagnostics
          - os: ubuntu-latest
            lint-features: acp-fixture,acp-schema,cdp-lane,codex-provisioning-helper,custom-protocol,diagnostics
            test-features: acp-fixture,acp-schema,codex-provisioning-helper,custom-protocol,diagnostics
          - os: macos-latest
            lint-features: acp-fixture,acp-schema,cdp-lane,codex-provisioning-helper,custom-protocol,diagnostics
            test-features: acp-fixture,acp-schema,codex-provisioning-helper,custom-protocol,diagnostics
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Create Tauri frontend placeholder
        run: >-
          node -e "require('node:fs').mkdirSync('dist', { recursive: true })"
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features "${{ matrix.lint-features }}" -- -D warnings
      - name: Test Rust parallel phase
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --features "${{ matrix.test-features }}" -- --skip repository_mutation_commands::tests:: --skip app_preview'
      - name: Test repository mutation commands serially
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --features "${{ matrix.test-features }}" repository_mutation_commands::tests:: -- --test-threads=1'
      - name: Test app preview serially
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --features "${{ matrix.test-features }}" app_preview -- --test-threads=1'
      - run: cargo check --manifest-path src-tauri/Cargo.toml --release --lib

  macos-shared-contracts:
    name: macOS shared contracts
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Compile shared contracts
        run: cargo check --manifest-path src-tauri/Cargo.toml --release --lib
      - name: Test workspace-notify shared contract
        run: cargo test --manifest-path src-tauri/Cargo.toml workspace::notify
      - name: Test editor-watch shared contract
        run: cargo test --manifest-path src-tauri/Cargo.toml editor_watch

  merge-gate:
    name: Merge gate
    if: always()
    needs:
      - frontend
      - smoke-cli
      - rust
      - macos-shared-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          FRONTEND: ${{ needs.frontend.result }}
          SMOKE_CLI: ${{ needs.smoke-cli.result }}
          RUST: ${{ needs.rust.result }}
          MACOS_SHARED_CONTRACTS: ${{ needs.macos-shared-contracts.result }}
        run: |
          test "$FRONTEND" = "success"
          test "$SMOKE_CLI" = "success"
          test "$RUST" = "success"
          test "$MACOS_SHARED_CONTRACTS" = "success"
