name: Harness protocol

# Compares each harness's newest published release with its newest checked
# protocol contract (src-tauri/tests/fixtures/harness-contracts) and prints
# every protocol change into the job summary. A red run means a harness
# changed its protocol: run `node scripts/harness-wire/upgrade.mjs --write`,
# recapture the corpus at that version and review both diffs in one PR.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node scripts/harness-wire/upgrade.mjs | tee -a "$GITHUB_STEP_SUMMARY"
