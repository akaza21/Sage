name: Desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/desktop-packages.yml]

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Universal macOS DMG
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable-2026-07-16
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build the universal installer
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg --ci -- --locked
      - name: Verify the image, signature and architectures
        shell: bash
        run: |
          set -euo pipefail
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          set -- "$bundle"/dmg/*.dmg
          test "$#" -eq 1
          dmg="$1"
          test -f "$dmg"
          hdiutil verify "$dmg"

          # Inspect the shipped image because Tauri cleans its staging app.
          mount="$(mktemp -d)"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          app="$mount/Sage.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/sage"
          ditto "$app" "$RUNNER_TEMP/Sage.app"

          mkdir -p work/macos-package
          cp "$dmg" work/macos-package/
          cd work/macos-package
          printf '%s\n' "$GITHUB_SHA" > source.txt
          shasum -a 256 ./*.dmg > SHA256SUMS.txt
      - name: Check the app bundle starts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import time

          binary = Path(os.environ["RUNNER_TEMP"]) / "Sage.app/Contents/MacOS/sage"
          log_path = Path("work/macos-package/startup.log")
          with log_path.open("wb") as log:
              app = subprocess.Popen([str(binary.resolve())], stdout=log, stderr=subprocess.STDOUT)
              try:
                  time.sleep(8)
                  if app.poll() is not None:
                      raise RuntimeError(f"Sage exited during startup: {app.returncode}")
              finally:
                  if app.poll() is None:
                      app.terminate()
                      try:
                          app.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          app.kill()
                          app.wait(timeout=5)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Sage-macOS-universal-${{ github.sha }}
          path: work/macos-package/
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable-2026-07-16
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build the Windows installer
        run: npm run tauri build -- --bundles nsis --ci -- --locked
      - name: Record the package checksum and source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work/windows-package
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe work/windows-package/
          Set-Content work/windows-package/source.txt $env:GITHUB_SHA
          Get-ChildItem work/windows-package -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          } | Set-Content work/windows-package/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Sage-Windows-${{ github.sha }}
          path: work/windows-package/
          if-no-files-found: error
          retention-days: 30
