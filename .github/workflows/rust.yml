name: Rust

# The Rust lanes, called by CI (Linux, on pull requests and main) and by
# After merge (Windows and macOS). Each runner gets the Cargo features that
# build on it, from scripts/cargo-features.mjs.

on:
  workflow_call:
    inputs:
      runners:
        description: JSON array of runner labels, for example ["ubuntu-latest"]
        type: string
        required: true

permissions:
  contents: read

env:
  # CI never attaches a debugger, and debug info is most of what the test
  # binaries cost to compile, link and cache. Locally the dev profile keeps
  # line tables for backtraces.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  features:
    name: Features
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.features.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cargo-features.mjs
            src-tauri/Cargo.toml
          sparse-checkout-cone-mode: false
      - name: Choose each runner's Cargo features
        id: features
        env:
          RUNNERS: ${{ inputs.runners }}
        run: |
          echo "matrix=$(node --input-type=module -e '
            import { runnerFeatures } from "./scripts/cargo-features.mjs";
            console.log(JSON.stringify(JSON.parse(process.argv[1]).map(runnerFeatures)));
          ' "$RUNNERS")" >> "$GITHUB_OUTPUT"

  rust-lint:
    name: Rust lint (${{ matrix.os }})
    needs: features
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.features.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features "${{ matrix.lint-features }}" -- -D warnings
      # Library targets only: no dev-dependency enables a test-support
      # feature, so the production configuration is linted as well.
      - run: cargo clippy --workspace --lib --features "${{ matrix.lint-features }}" -- -D warnings
      - run: cargo clippy -p sage --all-targets --features browser-bridge -- -D warnings

  rust:
    name: Rust (${{ matrix.os }})
    needs: features
    runs-on: ${{ matrix.os }}
    # The Rust work runs as three jobs on separate runners: lint, tests, and
    # the browser-bridge and release builds. Each keeps its own cache, saved
    # from main. A cold-cache run of this job builds and runs the parallel
    # test phase in about 20 minutes on ubuntu-latest. The macOS runner is the
    # slowest lane: its parallel phase alone takes 30 to 43 minutes, and its
    # serial phases about 6 more.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.features.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      # The parallel phase includes the shared-contract suites
      # (workspace_notify, editor_watch) on every platform it runs on.
      - name: Test Rust parallel phase
        run: 'cargo test --workspace --features "${{ matrix.test-features }}" -- --skip repository_mutation_commands::tests:: --skip app_preview'
      # src-tauri/permissions is generated (gitignored): build.rs writes
      # main-commands.toml and tauri-build writes autogenerated/ there, and
      # tauri-build also watches the folder. In a fresh checkout the build
      # creates them, which leaves the folder newer than the build script's
      # recorded run, so the next cargo command reruns the script and
      # recompiles the whole crate (about two minutes). The serial phases
      # read the same generated files, so dating them back lets those phases
      # reuse the build. Contents are untouched.
      - name: Date the generated permission files before the build
        run: >-
          node -e "const fs = require('node:fs'), path = require('node:path');
          const root = path.join('src-tauri', 'permissions');
          const entries = fs.readdirSync(root, { recursive: true }).map((name) => path.join(root, name));
          for (const entry of [...entries, root]) fs.utimesSync(entry, new Date(0), new Date(0));"
      - name: Test repository mutation commands serially
        run: 'cargo test --workspace --features "${{ matrix.test-features }}" repository_mutation_commands::tests:: -- --test-threads=1'
      - name: Test app preview serially
        run: 'cargo test --workspace --features "${{ matrix.test-features }}" app_preview -- --test-threads=1'

  rust-bridge:
    name: Rust bridge and release (${{ matrix.os }})
    needs: features
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.features.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      - run: "cargo test -p sage --features browser-bridge --lib dev_bridge::"
      - run: cargo check -p sage --release --lib
