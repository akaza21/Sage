name: Feature slice
description: Propose a small, observable Sage outcome.
title: "[ADE-]: "
labels:
  - feature
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who experiences this, and what is failing or missing?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Observable outcome
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope and out of scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable, testable statements.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options:
        - Low
        - Normal
        - High
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Security, data, and resource impact
    validations:
      required: true
